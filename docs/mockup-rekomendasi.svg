<svg xmlns="http://www.w3.org/2000/svg" width="420" height="640" viewBox="0 0 420 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .surface { fill: #ffffff; }
      .border { stroke: #e6ebf0; stroke-width: 1; }
      .accent { fill: #00b4d8; }
      .accentsoft { fill: #e3f7fb; }
      .fg { fill: #1a2733; }
      .muted { fill: #6b7a88; }
      .h1 { fill: #1a2733; font-size: 20px; font-weight: 700; }
      .label { fill: #6b7a88; font-size: 11px; }
      .big { fill: #1a2733; font-size: 20px; font-weight: 700; }
      .cardttl { fill: #1a2733; font-size: 13px; font-weight: 600; }
      .pct { fill: #1a2733; font-size: 12px; font-weight: 600; }
      .btnw { fill: #ffffff; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" width="420" height="640"/>

  <!-- stepper -->
  <rect x="24" y="24" width="372" height="34" rx="10" class="surface border"/>
  <text x="44" y="46" class="muted" font-size="11">1. Tujuan</text>
  <text x="150" y="46" class="muted" font-size="11">2. Survei Risiko</text>
  <circle cx="286" cy="41" r="4" class="accent"/>
  <text x="296" y="46" class="accent" font-size="11" font-weight="700">3. Rekomendasi</text>

  <text x="24" y="88" class="h1">Rekomendasi Investasi</text>
  <rect x="24" y="98" width="110" height="22" rx="11" class="accentsoft"/>
  <text x="36" y="113" class="accent" font-size="11" font-weight="600">Profil: Moderat</text>

  <!-- ringkasan angka -->
  <rect x="24" y="134" width="182" height="86" rx="14" class="surface border"/>
  <text x="40" y="158" class="label">Setoran per bulan</text>
  <text x="40" y="184" class="big">Rp 1.219.000</text>
  <text x="40" y="206" class="muted" font-size="10">agar target tercapai dalam 60 bln</text>

  <rect x="214" y="134" width="182" height="86" rx="14" class="surface border"/>
  <text x="230" y="158" class="label">Estimasi imbal hasil</text>
  <text x="230" y="184" class="big">6,5%<tspan font-size="12" class="muted"> /thn</tspan></text>
  <text x="230" y="206" class="muted" font-size="10">deterministik, bukan AI</text>

  <!-- komposisi alokasi -->
  <rect x="24" y="236" width="372" height="236" rx="16" class="surface border"/>
  <text x="40" y="262" class="cardttl">Komposisi Alokasi</text>

  <!-- bar komposisi -->
  <rect x="40" y="276" width="340" height="16" rx="8" fill="#eef2f5"/>
  <rect x="40" y="276" width="170" height="16" rx="8" class="accent"/>
  <rect x="210" y="276" width="136" height="16" fill="#5bc8de"/>
  <rect x="346" y="276" width="34" height="16" rx="8" fill="#9ad9e8"/>

  <!-- legend/items -->
  <circle cx="48" cy="316" r="5" class="accent"/>
  <text x="60" y="320" class="fg" font-size="12">Saham / Indeks</text>
  <text x="330" y="320" class="pct">50%</text>
  <text x="60" y="336" class="muted" font-size="10">Potensi tumbuh tinggi untuk jangka panjang ⓘ</text>
  <line x1="40" y1="350" x2="380" y2="350" class="border"/>

  <circle cx="48" cy="372" r="5" fill="#5bc8de"/>
  <text x="60" y="376" class="fg" font-size="12">SBN / Obligasi</text>
  <text x="330" y="376" class="pct">40%</text>
  <text x="60" y="392" class="muted" font-size="10">Relatif stabil, dijamin negara ⓘ</text>
  <line x1="40" y1="406" x2="380" y2="406" class="border"/>

  <circle cx="48" cy="428" r="5" fill="#9ad9e8"/>
  <text x="60" y="432" class="fg" font-size="12">Emas</text>
  <text x="330" y="432" class="pct">10%</text>
  <text x="60" y="448" class="muted" font-size="10">Pelindung nilai saat pasar bergejolak ⓘ</text>

  <!-- proyeksi (pro locked) -->
  <rect x="24" y="488" width="372" height="72" rx="14" class="surface border"/>
  <text x="40" y="512" class="cardttl">Proyeksi detail per instrumen</text>
  <rect x="300" y="498" width="80" height="22" rx="11" fill="#fff4e5"/>
  <text x="312" y="513" fill="#b5760a" font-size="10" font-weight="600">Fitur Pro 🔒</text>
  <text x="40" y="536" class="muted" font-size="11">Rincian setoran &amp; pertumbuhan tiap instrumen.</text>
  <text x="40" y="552" class="accent" font-size="11" font-weight="600">Upgrade ke Pro untuk membuka →</text>

  <!-- disclaimer -->
  <text x="24" y="588" class="muted" font-size="10">Simulasi edukatif, bukan nasihat keuangan tersertifikasi.</text>

  <!-- tombol -->
  <rect x="24" y="600" width="372" height="30" rx="10" class="accent"/>
  <text x="150" y="620" class="btnw">Simpan rekomendasi</text>
</svg>
